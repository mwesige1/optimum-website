<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Sent | Optimum Innovation Lab Ltd</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="images/favicon.png"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --navy: #020c1b; --dark: #0a1628; --card: #0d1f3c;
      --blue: #0a84ff; --cyan: #00d4ff; --light: #ccd6f6;
      --muted: #8892b0; --white: #e6f1ff;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--navy);
      color: var(--light); min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px 6%;
    }
    .grid-bg {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 55px 55px; pointer-events: none;
    }
    .wrap { position: relative; z-index: 1; max-width: 520px; }
    .check-icon {
      width: 90px; height: 90px; border-radius: 50%;
      background: rgba(0,212,255,0.08);
      border: 2px solid rgba(0,212,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 38px; color: var(--cyan);
      margin: 0 auto 32px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,212,255,0.3); }
      50% { box-shadow: 0 0 0 16px rgba(0,212,255,0); }
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700; color: var(--white); margin-bottom: 16px;
    }
    h1 span { color: var(--cyan); }
    p { font-size: 15px; color: var(--muted); line-height: 1.8; margin-bottom: 40px; }
    .btn-primary {
      padding: 13px 32px; border-radius: 8px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #fff; font-weight: 600; font-size: 14px;
      text-decoration: none; transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0,132,255,0.35);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 35px rgba(0,212,255,0.45); }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="wrap">
    <div class="check-icon"><i class="fas fa-check"></i></div>
    <h1>Message <span>Sent!</span></h1>
    <p>Thank you for reaching out to Optimum Innovation Lab Ltd. We have received your enquiry and will get back to you within 24 hours.</p>
    <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Back to Homepage</a>
  </div>
</body>
</html>
